<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorepsum — flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f5f1e8; --ink:#26231d; --muted:#8a8072; --line:#e0d9ca; --accent:#6b4e96;
    --accent-line:#c3b0dd;
    --serif:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',monospace;
  }
  :root[data-theme="dark"]{
    --canvas:#0e0d0c; --ink:#ece7dd; --muted:#8b857a; --line:#2a2723; --accent:#ad8bd4;
    --accent-line:#6f5c95;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--canvas);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  section{height:100vh;scroll-snap-align:start;position:relative;overflow:hidden}

  /* ---------- shared chrome ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px 28px}
  .lockup{display:flex;align-items:center;gap:10px}
  .lockup svg{width:24px;height:24px}
  .wordmark{font-weight:500;font-size:17px;letter-spacing:-.02em}
  .wordmark span{color:var(--accent)}
  .right{display:flex;align-items:center;gap:14px}
  .toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:border-color .2s,color .2s}
  .toggle:hover{border-color:var(--accent);color:var(--accent)}
  .toggle svg{width:16px;height:16px}
  .login{font-family:var(--mono);font-size:13px;color:var(--ink);text-decoration:none;letter-spacing:.02em;
    border:1px solid var(--line);border-radius:20px;padding:8px 16px;transition:border-color .2s,color .2s}
  .login:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- section 1: landing ---------- */
  .ambient{position:absolute;inset:0;z-index:0}
  .ambient svg{width:100%;height:100%}
  .ax{stroke:var(--line);stroke-width:1}
  .an{fill:var(--muted);opacity:.5}
  .ap{fill:var(--accent-line)}
  .center{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 24px 40px}
  .kicker{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
  .head{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1.1;max-width:640px}
  .head .p{color:var(--accent)}
  .star{position:relative;width:20px;height:20px;margin-top:64px;cursor:pointer}
  .star .core{position:absolute;inset:0;border-radius:50%;background:var(--accent);transition:transform .25s}
  .star .pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);
    animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .star .pulse.b{animation-delay:1.3s}
  .star:hover .core{transform:scale(1.25)}
  @keyframes pulse{0%{transform:scale(1);opacity:.65}100%{transform:scale(4);opacity:0}}

  /* ---------- section 2: chat + bloom ---------- */
  .lockup-mini{position:absolute;top:26px;left:28px;z-index:5}
  .lockup-mini svg{width:24px;height:24px}

  .stage{position:absolute;top:0;right:0;bottom:0;left:42%;z-index:1;pointer-events:none}
  .stage svg{width:100%;height:100%;user-select:none;-webkit-user-select:none}
  .edge{stroke:var(--accent-line);stroke-width:1.3;fill:none;
    stroke-dasharray:280;stroke-dashoffset:280;transition:stroke-dashoffset .85s ease}
  .born .edge{stroke-dashoffset:0}
  .node{opacity:0;transform:scale(.25);transform-box:fill-box;transform-origin:center;
    transition:opacity .55s ease, transform .6s cubic-bezier(.2,.7,.3,1)}
  .born .node{opacity:1;transform:scale(1)}
  .self{fill:var(--ink)}
  .starnode{fill:var(--accent)}
  .ring{fill:none;stroke:var(--accent-line);stroke-width:1.4}
  .attr{fill:none;stroke:var(--accent-line);stroke-width:1.6}
  .elabel{opacity:0;font-family:var(--mono);font-size:13px;transition:opacity .5s ease}
  .born .elabel{opacity:1}
  .elabel.mut{fill:var(--muted)}
  .elabel.acc{fill:var(--accent);font-weight:500;font-size:14px}
  .elabel.self{font-family:var(--serif);fill:var(--ink);font-size:16px}

  /* the chat card (moldura) */
  .frame{position:absolute;top:50%;left:50%;z-index:3;width:min(440px,92vw);
    background:var(--canvas);border:1px solid var(--line);border-radius:22px;padding:16px 20px 12px;
    transform:translate(-50%,-50%);
    transition:left .9s cubic-bezier(.5,0,.2,1), top .9s cubic-bezier(.5,0,.2,1), transform .9s cubic-bezier(.5,0,.2,1)}
  .bloomed .frame{left:4%;transform:translate(0,-50%)}

  /* narrow screens: stack (constellation on top, chat below) instead of side-by-side */
  @media (max-width:820px){
    .stage{left:0;right:0;top:0;bottom:auto;height:52%}
    .frame{top:auto;bottom:28px;transform:translate(-50%,-42vh)}
    .bloomed .frame{left:50%;transform:translate(-50%,0)}
  }

  .fhead{display:flex;align-items:center;gap:9px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .favatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .favatar svg{width:16px;height:16px}
  .fname{font-family:var(--mono);font-size:13px;letter-spacing:-.01em;color:var(--ink)}
  .fstatus{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:auto;font-style:italic;min-height:14px}

  .thread{display:flex;flex-direction:column;gap:11px;max-height:230px;overflow-y:auto}
  .thread::-webkit-scrollbar{display:none}
  .say{display:flex;gap:9px;align-items:flex-start;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .say .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:6px}
  .say p{font-family:var(--serif);font-size:18px;line-height:1.35;color:var(--ink)}
  .say p .up{color:var(--accent)}
  .say.me{justify-content:flex-end}
  .say.me p{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent);
    padding:5px 14px;border-radius:15px}
  .dots{display:inline-flex;gap:5px;align-items:center;padding:9px 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.3;animation:blink 1.3s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}

  .compose{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .compose input{flex:1;border:none;background:none;outline:none;color:var(--ink);font-family:var(--serif);font-size:17px}
  .compose input::placeholder{color:var(--muted);font-style:italic}
  .go{width:34px;height:34px;border:none;border-radius:50%;background:var(--accent);color:#fff;
    font-size:17px;cursor:pointer;flex:0 0 auto;line-height:1}
</style>
</head>
<body>

  <!-- ===================== SECTION 1 — LANDING ===================== -->
  <section id="landing">
    <div class="ambient">
      <svg viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <line class="ax" x1="120" y1="120" x2="230" y2="70"/><line class="ax" x1="230" y1="70" x2="90" y2="220"/>
        <line class="ax" x1="880" y1="110" x2="780" y2="200"/><line class="ax" x1="880" y1="110" x2="940" y2="240"/>
        <line class="ax" x1="150" y1="500" x2="260" y2="560"/><line class="ax" x1="800" y1="520" x2="700" y2="470"/>
        <line class="ax" x1="800" y1="520" x2="900" y2="580"/>
        <circle class="an" cx="120" cy="120" r="3"/><circle class="ap" cx="230" cy="70" r="3.4"/>
        <circle class="an" cx="90" cy="220" r="2.6"/><circle class="an" cx="880" cy="110" r="3"/>
        <circle class="an" cx="780" cy="200" r="2.6"/><circle class="ap" cx="940" cy="240" r="3.2"/>
        <circle class="an" cx="150" cy="500" r="2.6"/><circle class="ap" cx="260" cy="560" r="3.2"/>
        <circle class="an" cx="800" cy="520" r="3"/><circle class="an" cx="700" cy="470" r="2.6"/>
        <circle class="an" cx="900" cy="580" r="2.6"/>
      </svg>
    </div>

    <header class="topbar">
      <div class="lockup">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <line x1="23" y1="24" x2="10" y2="17" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="23" y1="24" x2="37" y2="13" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="23" y1="24" x2="17" y2="38" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="23" y1="24" x2="37" y2="35" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="10" cy="17" r="2.8" fill="var(--ink)"/><circle cx="37" cy="13" r="2.8" fill="var(--ink)"/>
          <circle cx="17" cy="38" r="2.8" fill="var(--ink)"/><circle cx="37" cy="35" r="2.8" fill="var(--ink)"/>
          <circle cx="23" cy="24" r="5.6" fill="var(--ink)"/>
        </svg>
        <div class="wordmark">lorepsum<span>.</span></div>
      </div>
      <div class="right">
        <button class="toggle" id="toggle" aria-label="theme">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
        <a class="login" href="#">log in</a>
      </div>
    </header>

    <div class="center">
      <p class="kicker">your lore</p>
      <h1 class="head">Everything you love,<br>connected in a <span class="p">constellation</span>.</h1>
      <div class="star" id="star" role="button" aria-label="begin">
        <span class="pulse"></span><span class="pulse b"></span><span class="core"></span>
      </div>
    </div>
  </section>

  <!-- ===================== SECTION 2 — CHAT → BLOOM ===================== -->
  <section id="chat">
    <div class="lockup lockup-mini">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <line x1="23" y1="24" x2="10" y2="17" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="37" y2="13" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="17" y2="38" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="37" y2="35" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="10" cy="17" r="2.8" fill="var(--ink)"/><circle cx="37" cy="13" r="2.8" fill="var(--ink)"/>
        <circle cx="17" cy="38" r="2.8" fill="var(--ink)"/><circle cx="37" cy="35" r="2.8" fill="var(--ink)"/>
        <circle cx="23" cy="24" r="5.6" fill="var(--ink)"/>
      </svg>
    </div>

    <!-- constellation: hidden until the answer -->
    <div class="stage" id="stage">
      <svg viewBox="0 0 820 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <line class="edge" x1="400" y1="360" x2="230" y2="250" style="transition-delay:.25s"/>
        <line class="edge" x1="400" y1="360" x2="575" y2="230" style="transition-delay:.4s"/>
        <line class="edge" x1="400" y1="360" x2="610" y2="470" style="transition-delay:.55s"/>
        <line class="edge" x1="400" y1="540" x2="400" y2="360" style="transition-delay:1.15s"/>
        <circle class="node attr" cx="230" cy="250" r="4" style="transition-delay:.5s"/>
        <circle class="node attr" cx="575" cy="230" r="4" style="transition-delay:.65s"/>
        <circle class="node attr" cx="610" cy="470" r="4" style="transition-delay:.8s"/>
        <text class="elabel mut" x="214" y="255" text-anchor="end" style="transition-delay:.7s">Christopher Nolan</text>
        <text class="elabel mut" x="592" y="235" style="transition-delay:.85s">science fiction</text>
        <text class="elabel mut" x="626" y="475" style="transition-delay:1s">2014</text>
        <circle class="node ring" cx="400" cy="360" r="16" style="transition-delay:0s"/>
        <circle class="node starnode" cx="400" cy="360" r="9" style="transition-delay:0s"/>
        <text class="elabel acc" id="answerLabel" x="424" y="365" style="transition-delay:.2s">Interstellar</text>
        <circle class="node self" cx="400" cy="540" r="10" style="transition-delay:1.4s"/>
        <text class="elabel self" id="selfLabel" x="424" y="546" style="transition-delay:1.6s">you</text>
      </svg>
    </div>

    <div class="frame" id="frame">
      <div class="fhead">
        <span class="favatar">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <line x1="23" y1="24" x2="10" y2="17" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="23" y1="24" x2="37" y2="13" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="23" y1="24" x2="17" y2="38" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="23" y1="24" x2="37" y2="35" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="10" cy="17" r="2.9" fill="var(--ink)"/><circle cx="37" cy="13" r="2.9" fill="var(--ink)"/>
            <circle cx="17" cy="38" r="2.9" fill="var(--ink)"/><circle cx="37" cy="35" r="2.9" fill="var(--ink)"/>
            <circle cx="23" cy="24" r="5.6" fill="var(--ink)"/>
          </svg>
        </span>
        <span class="fname">lorepsum</span>
        <span class="fstatus" id="fstatus"></span>
      </div>
      <div class="thread" id="thread"></div>
      <form class="compose" id="form">
        <input id="input" type="text" placeholder="say something…" aria-label="message" autocomplete="off">
        <button class="go" type="submit" aria-label="send">&rarr;</button>
      </form>
    </div>
  </section>

  <script>
    /* theme toggle */
    document.getElementById('toggle').addEventListener('click', function(){
      var r = document.documentElement;
      r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* star → scroll down to chat */
    document.getElementById('star').addEventListener('click', function(){
      document.getElementById('chat').scrollIntoView({behavior:'smooth'});
    });

    var chat   = document.getElementById('chat');
    var stage  = document.getElementById('stage');
    var thread = document.getElementById('thread');
    var status = document.getElementById('fstatus');
    var form   = document.getElementById('form');
    var input  = document.getElementById('input');
    var step   = 0;

    function scrollThread(){ thread.scrollTop = thread.scrollHeight; }
    function showTyping(){
      status.textContent = 'typing…';
      var d = document.createElement('div');
      d.className = 'say';
      d.innerHTML = '<span class="dot"></span><span class="dots"><i></i><i></i><i></i></span>';
      thread.appendChild(d); scrollThread();
      return d;
    }
    function agentText(text){
      var d = document.createElement('div');
      d.className = 'say';
      d.innerHTML = '<span class="dot"></span><p>' + text + '</p>';
      thread.appendChild(d); scrollThread();
    }
    function meText(text){
      var d = document.createElement('div');
      d.className = 'say me';
      d.innerHTML = '<p>' + text + '</p>';
      thread.appendChild(d); scrollThread();
    }
    /* typing dots → then the message; onDone fires after it lands */
    function agentSay(text, onDone, dur){
      var t = showTyping();
      setTimeout(function(){
        t.remove(); status.textContent = '';
        agentText(text);
        if(onDone) onDone();
      }, dur || 1300);
    }

    /* opening: plays once, when the chat scrolls into view */
    var started = false;
    function startChat(){
      if(started) return; started = true;
      setTimeout(function(){
        agentSay('hey.', function(){
          setTimeout(function(){
            agentSay('tell me about something you love — a film, a book, a place. anything.');
          }, 450);
        });
      }, 500);
    }
    new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting) startChat(); });
    }, {threshold:0.5}).observe(chat);

    /* the conversation */
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var val = input.value.trim();

      if(step === 0){
        var answer = val || 'Interstellar';
        document.getElementById('answerLabel').textContent = answer;
        meText(answer);
        input.value = ''; input.placeholder = 'your name…';
        step = 1;
        /* the agent "draws" the constellation while it replies */
        setTimeout(function(){ chat.classList.add('bloomed'); stage.classList.add('born'); }, 500);
        agentSay('oh — ' + answer + '. there it is <span class="up">&rarr;</span>', function(){
          setTimeout(function(){ agentSay('and you — who are you?'); }, 650);
        });
      } else if(step === 1){
        var name = val || 'you';
        document.getElementById('selfLabel').textContent = name.toLowerCase();
        meText(name);
        input.value = ''; input.placeholder = 'keep going…';
        step = 2;
        agentSay('there you are. this is your lore now — everything connects from here.');
      } else {
        input.value = '';
      }
    });
  </script>
</body>
</html>
