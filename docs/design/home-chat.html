<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorepsum — home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f5f1e8; --ink:#26231d; --muted:#8a8072; --line:#ddd4c3; --accent:#6b4e96;
    --accent-line:#b7a0d6; --accent-soft:#ece4f2;
    --serif:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--canvas);color:var(--ink);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
  .home{position:relative;height:100vh}

  /* a lore = herói, ocupa a tela */
  .stage{position:absolute;inset:0}
  .stage svg{width:100%;height:100%}
  .edge{stroke:var(--accent-line);stroke-width:1.3}
  .self{fill:var(--ink)}
  .star{fill:var(--accent)}
  .ring{fill:none;stroke:var(--accent-line);stroke-width:1.4}
  .attr{fill:none;stroke:var(--accent-line);stroke-width:1.6}
  .lbl{font-family:var(--mono);font-size:13px}
  .lbl.mut{fill:var(--muted)}
  .lbl.acc{fill:var(--accent);font-weight:500;font-size:14px}
  .lbl.self{font-family:var(--serif);fill:var(--ink);font-size:16px}

  .lockup{position:absolute;top:26px;left:28px;display:flex;align-items:center;gap:10px}
  .lockup svg{width:24px;height:24px}
  .wordmark{font-weight:500;font-size:17px;letter-spacing:-.02em}
  .wordmark span{color:var(--accent)}

  /* conversa = camada leve embaixo, descontraída */
  .dock{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    width:min(560px,90vw)}
  .say{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
  .say .dot{width:13px;height:13px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:5px}
  .say p{font-family:var(--serif);font-size:20px;line-height:1.35;color:var(--ink)}
  .say p .up{color:var(--accent)}
  .say.past p{font-size:15px;color:var(--muted)}
  .field{display:flex;align-items:center;gap:12px;background:var(--canvas);
    border:1.5px solid var(--accent-line);border-radius:30px;padding:8px 8px 8px 20px;margin-top:14px}
  .field input{flex:1;border:none;background:none;outline:none;color:var(--ink);
    font-family:var(--serif);font-size:18px}
  .field input::placeholder{color:var(--muted);font-style:italic}
  .go{width:36px;height:36px;border:none;border-radius:50%;background:var(--accent);color:#fff;
    font-size:18px;cursor:pointer;flex:0 0 auto;line-height:1}
</style>
</head>
<body>
  <div class="home">

    <div class="stage">
      <svg viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="a sua lore nascendo">
        <line class="edge" x1="500" y1="340" x2="500" y2="215"/>
        <line class="edge" x1="500" y1="215" x2="330" y2="140"/>
        <line class="edge" x1="500" y1="215" x2="690" y2="160"/>
        <line class="edge" x1="500" y1="215" x2="700" y2="300"/>

        <circle class="attr" cx="330" cy="140" r="3.6"/><text class="lbl mut" x="344" y="145">Christopher Nolan</text>
        <circle class="attr" cx="690" cy="160" r="3.6"/><text class="lbl mut" x="704" y="165">ficção científica</text>
        <circle class="attr" cx="700" cy="300" r="3.6"/><text class="lbl mut" x="714" y="305">2014</text>

        <circle class="ring" cx="500" cy="215" r="15"/>
        <circle class="star" cx="500" cy="215" r="8.5"/><text class="lbl acc" x="518" y="220">Interestelar</text>

        <circle class="self" cx="500" cy="340" r="9.5"/><text class="lbl self" x="518" y="345">você</text>
      </svg>
    </div>

    <div class="lockup">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <line x1="23" y1="24" x2="10" y2="17" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="37" y2="13" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="17" y2="38" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="23" y1="24" x2="37" y2="35" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="10" cy="17" r="2.8" fill="var(--ink)"/><circle cx="37" cy="13" r="2.8" fill="var(--ink)"/>
        <circle cx="17" cy="38" r="2.8" fill="var(--ink)"/><circle cx="37" cy="35" r="2.8" fill="var(--ink)"/>
        <circle cx="23" cy="24" r="5.6" fill="var(--ink)"/>
      </svg>
      <div class="wordmark">lorepsum<span>.</span></div>
    </div>

    <div class="dock">
      <div class="say past"><span class="dot" style="background:var(--muted)"></span><p>Interestelar — o Nolan e o tempo. adoro.</p></div>
      <div class="say"><span class="dot"></span><p>olha ela nascendo aí <span class="up">↑</span> — e você, quem é?</p></div>
      <div class="field">
        <input type="text" placeholder="seu nome…" aria-label="seu nome">
        <button class="go" aria-label="continuar">&rarr;</button>
      </div>
    </div>

  </div>
</body>
</html>
