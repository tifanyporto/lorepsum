<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* The favicon lives OUTSIDE the app: it cannot reach the variables in
       index.css. Palette colours are written here as hex, and dark mode
       follows the SYSTEM preference, not the theme toggle in the UI. */
    .ink    { stroke: #26231d; fill: #26231d; }
    .accent { stroke: #6b4e96; fill: #6b4e96; }
    @media (prefers-color-scheme: dark) {
      .ink    { stroke: #ece7dd; fill: #ece7dd; }
      .accent { stroke: #ad8bd4; fill: #ad8bd4; }
    }
  </style>

  <g fill="none" stroke-linecap="round">
    <line class="ink"    x1="15.6" y1="14.7" x2="4.4"  y2="8.7"  stroke-width="3.2"/>
    <line class="accent" x1="15.6" y1="14.7" x2="27.6" y2="5.3"  stroke-width="3.6"/>
    <line class="ink"    x1="15.6" y1="14.7" x2="10.4" y2="26.8" stroke-width="3.2"/>
    <line class="ink"    x1="15.6" y1="14.7" x2="27.6" y2="24.2" stroke-width="3.2"/>
  </g>

  <circle class="ink" cx="4.4"  cy="8.7"  r="3.2" stroke="none"/>
  <circle class="ink" cx="27.6" cy="5.3"  r="3.2" stroke="none"/>
  <circle class="ink" cx="10.4" cy="26.8" r="3.2" stroke="none"/>
  <circle class="ink" cx="27.6" cy="24.2" r="3.2" stroke="none"/>
  <circle class="ink" cx="15.6" cy="14.7" r="5"   stroke="none"/>
</svg>
